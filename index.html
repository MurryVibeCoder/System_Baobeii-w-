<!DOCTYPE html>
<html lang="en" data-skin="her">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lily &amp; Lotus Dates</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Design tokens (his skin is the :root default, her skin overrides) */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
<!-- His skin: removed from the page when the girlfriend signs in -->
<style id="skin-him">
html[data-skin="him"]{--bg:#000;--surf:#0b0810;--ink:#f1e8ff;--mut:#a994cc;--pink:#a45cff;--deep:#c79bff;--blush:#150e24;--line:#33205a;--sh:0 12px 40px -14px rgba(164,92,255,.45);color-scheme:dark;--g1:#b58bff;--g2:#6a22c9;--g3:#5a1db0;--glow1:rgba(164,92,255,.22);--glow2:rgba(164,92,255,.15);--ovl:rgba(0,0,0,.65);--pt:#d2b3ff;--dsh:rgba(164,92,255,.45)}
</style>
<!-- Her skin: removed from the page when the boyfriend signs in -->
<style id="skin-her">
html[data-skin="her"]{--bg:#fff3f8;--surf:#fff;--ink:#4a1f33;--mut:#946781;--pink:#e8588f;--deep:#b02a63;--blush:#ffe4ef;--line:#f7cfe0;--sh:0 12px 40px -14px rgba(176,42,99,.35);color-scheme:light;--g1:#ff8dbb;--g2:#d63a82;--g3:#c92d77;--glow1:#ffe4ef;--glow2:#ffe4ef;--ovl:rgba(74,31,51,.45);--pt:#f48fb8;--dsh:rgba(232,88,143,.4)}

</style>
<style>
/* Base */
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font:15px/1.5 Figtree,system-ui,sans-serif;color:var(--ink);background:radial-gradient(900px 500px at 85% -10%,var(--glow1),transparent 60%),radial-gradient(700px 500px at -5% 105%,var(--glow2),transparent 60%),var(--bg);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

/* Lily and lotus artwork */
.lily .p{transform-box:view-box;transform-origin:50px 84px;transform:rotate(var(--r))}
.lily .p path{stroke:#e9d9ff;stroke-opacity:.6;stroke-width:.8;stroke-linejoin:round}
.lily .b path:first-child{fill:url(#gb)}
.lily .f path:first-child{fill:url(#gf)}
.lily .p .vn{fill:none;stroke-opacity:.35;stroke-linecap:round}
.lily .w{fill:none;stroke:#8d4be0;stroke-width:2;stroke-linecap:round;opacity:.85}
.lily .v{stroke:#d6407f;stroke-opacity:.35;fill:none;stroke-width:.8}
.lily .a{fill:#ffc94d}
.lily .s{stroke:#d6407f;stroke-width:1.2}
.lily path.p{fill:url(#pgh);stroke:#d6407f;stroke-width:.8;stroke-opacity:.5}
.bloom .p{animation:open 1.6s cubic-bezier(.2,1.5,.4,1) backwards;animation-delay:calc(var(--i)*110ms)}
.bloom .s,.bloom .a,.bloom .w{animation:fade 1s 1s backwards}
@keyframes open{from{transform:rotate(calc(var(--r) - 40deg)) scale(0);opacity:0}}
@keyframes fade{from{opacity:0}}

/* Background garden */
.garden{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.garden .lily{position:absolute;opacity:.13;animation:drift var(--t) ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(24px,-34px) rotate(var(--rot))}}

/* App shell and header */
.app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand .lily{width:76px;height:76px;filter:drop-shadow(0 6px 10px var(--dsh));animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(8deg)}}
h1{font:700 clamp(30px,5vw,44px)/1 "Cormorant Garamond",Georgia,serif;margin:0;letter-spacing:.01em;color:var(--deep)}
.brand p{margin:2px 0 0;color:var(--mut);font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative}
.search input{width:210px;max-width:100%;padding:10px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surf);transition:.25s}
.search input:focus{width:260px;border-color:var(--pink);outline:0;box-shadow:0 0 0 4px color-mix(in srgb,var(--pink) 20%,transparent)}
.who{font:600 italic 21px "Cormorant Garamond",Georgia,serif;color:var(--deep);padding:0 4px}

/* Buttons */
.btn{border:1.5px solid var(--line);background:var(--surf);padding:9px 15px;border-radius:99px;font-weight:500;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,var(--g1),var(--pink) 50%,var(--g2));color:#fff;border:0;position:relative;overflow:hidden}
.btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3.6s infinite}
@keyframes shine{40%,100%{transform:translateX(120%)}}

/* Layout and cards */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:18px}

/* Calendar toolbar and filters */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.bar h2{font:700 clamp(26px,4vw,34px)/1 "Cormorant Garamond",Georgia,serif;margin:0;min-width:190px;color:var(--deep)}
.nav{display:flex;gap:6px}
.nav .btn{padding:8px 13px}
.seg{display:inline-flex;background:var(--blush);border-radius:99px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:99px;color:var(--mut);font-weight:500}
.seg .on{background:var(--surf);color:var(--deep);box-shadow:0 2px 8px var(--dsh)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:none;border-radius:99px;padding:4px 12px;font-size:13px;display:flex;align-items:center;gap:6px;transition:.2s}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--pink))}
.chip.on{background:var(--blush);border-color:var(--pink);color:var(--deep)}

/* Calendar grid */
.wk,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk div{text-align:center;color:var(--mut);font-size:13px;font-weight:600;padding:4px 0}
.cell{min-height:96px;border-radius:16px;border:1px solid var(--line);background:color-mix(in srgb,var(--blush) 35%,var(--surf));padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.cell:hover{transform:translateY(-3px) scale(1.02);box-shadow:var(--sh);border-color:var(--pink);z-index:2}
.cell.out{opacity:.45}
.cell.sel{border-color:var(--pink);box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 28%,transparent)}
.cell.today .n{background:var(--pink);color:#fff;box-shadow:0 0 0 0 var(--pink);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}}
.n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px}
.pill{border:0;border-radius:8px;padding:2px 6px;font-size:11.5px;text-align:left;color:#fff;background:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;transition:filter .2s}
.pill:hover{filter:brightness(1.12)}
.pill.done{opacity:.5;text-decoration:line-through}
.more{font-size:11px;color:var(--mut)}
.enter .cell{animation:rise .55s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--d)*14ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.9)}}

/* Sidebar */
.side{display:flex;flex-direction:column;gap:18px}
.next{background:linear-gradient(150deg,var(--g1),var(--pink) 55%,var(--g3));color:#fff;border:0;position:relative;overflow:hidden}
.next .lily{position:absolute;right:-26px;bottom:-30px;width:150px;opacity:.28;animation:sway 7s ease-in-out infinite alternate}
.next h3{font:700 26px/1.1 "Cormorant Garamond",Georgia,serif;margin:4px 0}
.next small{opacity:.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font:700 30px/1 "Cormorant Garamond",serif;color:var(--deep)}
.stats span{font-size:12px;color:var(--mut)}
.side h3.t{margin:0 0 10px;font:700 22px "Cormorant Garamond",Georgia,serif;color:var(--deep)}
.item{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:14px;border-left:5px solid var(--c);background:var(--blush);margin-bottom:8px;width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0;transition:transform .2s}
.item:hover{transform:translateX(5px)}
.item b{display:block;font-weight:600}
.item small{color:var(--mut)}

/* Agenda list and empty state */
.ag{display:flex;flex-direction:column;gap:8px}
.ag .day{font:700 20px "Cormorant Garamond",serif;color:var(--deep);margin:10px 0 2px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--blush);border-left:6px solid var(--c);animation:rise .4s backwards}
.row .tx{flex:1;min-width:0}
.row.done .tx b{text-decoration:line-through;opacity:.55}
.row small{color:var(--mut)}
.row input{accent-color:var(--pink);width:18px;height:18px}
.ic{border:0;background:none;font-size:16px;padding:4px 7px;border-radius:8px}
.ic:hover{background:var(--line)}
.empty{text-align:center;color:var(--mut);padding:26px 8px}
.empty .lily{width:90px;height:90px;display:block;margin:0 auto 6px}

/* Modal and forms */
.ov{position:fixed;inset:0;z-index:20;background:var(--ovl);backdrop-filter:blur(6px);display:none;place-items:center;padding:16px}
.ov.show{display:grid;animation:fade .25s}
.modal{background:var(--surf);width:min(480px,100%);max-height:92vh;overflow:auto;border-radius:28px;padding:22px;box-shadow:0 30px 80px -20px #000;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7) translateY(30px);opacity:0}}
.modal h2{font:700 30px "Cormorant Garamond",Georgia,serif;margin:0 0 12px;color:var(--deep)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut);font-weight:500}
.f .w{grid-column:1/-1}
.f input,.f select,.f textarea,.modal textarea{padding:10px 12px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--pink)}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.foot .del{margin-right:auto;color:var(--deep)}

/* Toasts and petal burst */
.toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;box-shadow:var(--sh);animation:up .4s cubic-bezier(.2,1.4,.4,1),fade .4s 2.6s reverse forwards}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.petal{position:fixed;z-index:50;width:18px;height:26px;pointer-events:none;border-radius:60% 60% 50% 50%/80% 80% 20% 20%;background:linear-gradient(#fff,var(--pt))}

/* Login screen */
html:not(.in) .app,html:not(.in) .garden{visibility:hidden}
#login{position:fixed;inset:0;z-index:60;display:flex;background:#000}
html.in #login{display:none}
#login .lt{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:3;padding:8px 20px;border-radius:99px;background:rgba(20,10,30,.72);backdrop-filter:blur(8px);color:#fff;font:600 italic 22px "Cormorant Garamond",Georgia,serif;margin:0;white-space:nowrap;pointer-events:none}
.pane{flex:1;position:relative;display:grid;place-items:center;padding:70px 20px 20px;cursor:pointer;overflow:hidden;transition:flex .8s cubic-bezier(.2,.9,.2,1)}
.pane.open{flex:2.4;cursor:default}
.pane.shrunk{flex:.55}
.pane.shrunk .box>*:not(.lg){opacity:0}
.pane.her{background:radial-gradient(600px 420px at 50% 40%,#ffd3e5,transparent 70%),#fff0f6;color:#4a1f33}
.pane.him{background:radial-gradient(600px 420px at 50% 40%,rgba(164,92,255,.3),transparent 70%),#000;color:#f1e8ff}
.pane .box{width:min(340px,100%);text-align:center;transition:opacity .4s}
.pane .lg .lily{width:150px;height:150px;transition:transform .6s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(0 10px 18px rgba(200,60,130,.35))}
.pane.him .lg .lily{filter:drop-shadow(0 10px 18px rgba(164,92,255,.5))}
.pane:hover .lg .lily{transform:scale(1.1) rotate(4deg)}
.pane.open .lg .lily{transform:scale(.8)}
.pane h2{font:700 38px/1.1 "Cormorant Garamond",Georgia,serif;margin:6px 0 2px}
.pane.her h2{color:#b02a63}
.pane.him h2{color:#c79bff}
.pane .sub{margin:0 0 6px;font:italic 19px "Cormorant Garamond",Georgia,serif;opacity:.8}
.pane .tap{font-size:13px;opacity:.6;margin:10px 0 0}
.pane.open .tap{display:none}
.pane form{display:none;gap:10px;text-align:left;margin-top:10px}
.pane.open form{display:grid;animation:fade .6s .25s backwards}
.pane form input:not([type=checkbox]){width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--b);background:var(--f);color:inherit;transition:.2s}
.pane.her form{--b:#f7cfe0;--f:#fff;--a:#e8588f}
.pane.him form{--b:#33205a;--f:#130c1e;--a:#a45cff}
.pane form input:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 25%,transparent)}
.keep{display:flex;gap:8px;align-items:center;font-size:13px;opacity:.85}
.keep input{accent-color:var(--a)}
.err{min-height:18px;font-size:13px;color:#d6336c}
.pane.him .err{color:#ff8fb3}
.go{border:0;border-radius:99px;padding:12px;font-weight:600;color:#fff;cursor:pointer;transition:transform .2s}
.go:hover{transform:translateY(-2px)}
.pane.her .go{background:linear-gradient(135deg,#ff8dbb,#e8588f 50%,#d63a82);box-shadow:0 10px 24px -10px #b02a63}
.pane.him .go{background:linear-gradient(135deg,#b58bff,#a45cff 50%,#6a22c9);box-shadow:0 10px 24px -10px #a45cff}
.lnk{display:flex;justify-content:center;gap:12px}
.lk{border:0;background:none;font-size:13px;color:inherit;opacity:.7;text-decoration:underline;cursor:pointer}
.shake .box{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* Responsive */
@media (max-width:960px){.layout{grid-template-columns:1fr}}
@media (max-width:640px){.cell{min-height:64px;padding:3px}.pill{font-size:0;height:7px;padding:0}.search input,.search input:focus{width:150px}}
@media (max-width:700px){#login{flex-direction:column}.pane{padding-top:56px}.pane .lg .lily{width:100px;height:100px}.pane h2{font-size:30px}.pane.shrunk{flex:.4}.pane.open{flex:3}}

/* Reduced motion */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- Shared gradients for the lotus (his skin) and the lily (her skin) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="pg" cx="50%" cy="88%" r="95%"><stop offset="0" stop-color="#f3eaff"/><stop offset=".55" stop-color="#c9a4ff"/><stop offset="1" stop-color="#8a3fe6"/></radialGradient>
    <linearGradient id="gb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3b138a"/><stop offset="1" stop-color="#8a3fe6"/></linearGradient>
    <linearGradient id="gf" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9a5cf0"/><stop offset="1" stop-color="#e3ccff"/></linearGradient>
    <radialGradient id="pgh" cx="50%" cy="88%" r="95%"><stop offset="0" stop-color="#fff8fb"/><stop offset=".55" stop-color="#ffc2da"/><stop offset="1" stop-color="#ee6a9f"/></radialGradient>
  </defs>
</svg>

<!-- Floating background flowers (filled by JavaScript) -->
<div class="garden" id="garden" aria-hidden="true"></div>

<!-- Main app -->
<div class="app">
  <header class="top">
    <div class="brand">
      <span id="logo"></span>
      <div>
        <h1 id="h1">Lily Dates</h1>
        <p id="tag">Your schedule, in bloom</p>
      </div>
    </div>
    <div class="actions">
      <span class="who" id="who"></span>
      <button class="btn" id="out">Log out</button>
      <div class="search"><input id="q" type="search" placeholder="Search dates (press /)" aria-label="Search dates"></div>
      <button class="btn" id="bk">Backup</button>
      <button class="btn" id="lnkdev">Link device</button>
      <button class="btn" id="rst">Reset data</button>
      <button class="btn pri" id="new">+ New date</button>
    </div>
  </header>

  <main class="layout">
    <section class="card">
      <div class="bar">
        <h2 id="title"></h2>
        <div class="nav">
          <button class="btn" id="prev" aria-label="Previous month">‹</button>
          <button class="btn" id="today">Today</button>
          <button class="btn" id="nxt" aria-label="Next month">›</button>
        </div>
        <div class="seg" id="seg">
          <button data-m="month" class="on">Month</button>
          <button data-m="agenda">Agenda</button>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div id="body"></div>
    </section>

    <aside class="side">
      <div class="card next" id="next"></div>
      <div class="card stats" id="stats"></div>
      <div class="card">
        <h3 class="t">Coming up</h3>
        <div id="up"></div>
      </div>
    </aside>
  </main>
</div>

<!-- Modal for the date form and backup -->
<div class="ov" id="ov"><div class="modal" id="md" role="dialog" aria-modal="true"></div></div>

<!-- Toast messages -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- Login screen (filled by JavaScript, emptied after sign-in) -->
<div id="login" role="dialog" aria-label="Sign in"></div>

<script>
/* ==========================================================================
   Constants and skin palettes
   ========================================================================== */

let skin = 'her';

const CATS = {
    date: ['Date night', ''],
    family: ['Family', ''],
    work: ['Work', ''],
    care: ['Self-care', ''],
    other: ['Other', '']
};

const PAL = {
    her: { date: '#e8588f', family: '#ee8b4f', work: '#9b5de5', care: '#d63fa6', other: '#b8749a' },
    him: { date: '#a45cff', family: '#e056c9', work: '#6f7bff', care: '#2fb8a6', other: '#8b7aa8' }
};

const TXT = {
    her: ['Lily Dates', 'Your schedule, in bloom'],
    him: ['Midnight Lotus', 'Your schedule, in still water']
};

for (const c in CATS) { CATS[c][1] = PAL.her[c]; }

/* ==========================================================================
   Helpers
   ========================================================================== */

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const MN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const tm = t => {
    if (!t) { return ''; }
    let [h, m] = t.split(':');
    h = +h;
    return `${h % 12 || 12}:${m} ${h < 12 ? 'AM' : 'PM'}`;
};

const nice = d => new Date(d + 'T00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

/* ==========================================================================
   Lily artwork (her) and lotus artwork (him)
   ========================================================================== */

function lilyHer(cls = '') {
    let p = '';
    for (let i = 0; i < 6; i++) {
        p += `<path class="p" style="--r:${i * 60}deg;--i:${i};transform-origin:50px 50px" d="M50 52C37 36 40 14 50 2C60 14 63 36 50 52Z"/><path class="v" style="transform:rotate(${i * 60}deg);transform-origin:50px 50px;transform-box:view-box" d="M50 50V12"/>`;
    }
    let s = '';
    for (let i = 0; i < 6; i++) {
        const a = (i * 60 + 30) * Math.PI / 180, x = 50 + Math.sin(a) * 17, y = 50 - Math.cos(a) * 17;
        s += `<line class="s" x1="50" y1="50" x2="${x}" y2="${y}"/><ellipse class="a" cx="${x}" cy="${y}" rx="2.6" ry="4" transform="rotate(${i * 60 + 30} ${x} ${y})"/>`;
    }
    return `<svg class="lily ${cls}" viewBox="0 0 100 100" aria-hidden="true">${p}${s}</svg>`;
}

function lilyHim(cls = '') {
    let p = '', k = 0;
    const P = (c, L, W, r) => {
        const t = 84 - L;
        return `<g class="p ${c}" style="--r:${r}deg;--i:${k++}"><path d="M50 84C${50 - W * 1.25} ${84 - L * .18} ${50 - W * 1.1} ${84 - L * .62} 50 ${t}C${50 + W * 1.1} ${84 - L * .62} ${50 + W * 1.25} ${84 - L * .18} 50 84Z"/><path class="vn" d="M50 80V${t + L * .3}"/></g>`;
    };
    [[-60, 42], [-30, 58], [0, 74], [30, 58], [60, 42]].forEach(([r, L]) => p += P('b', L, 13, r));
    [[-46, 38], [-16, 56], [16, 56], [46, 38]].forEach(([r, L]) => p += P('f', L, 13.5, r));
    return `<svg class="lily ${cls}" viewBox="0 0 100 100" aria-hidden="true">${p}<ellipse cx="50" cy="85" rx="9" ry="3.4" fill="#3a1370"/><path class="w" d="M12 91Q50 99 88 91"/><path class="w" style="opacity:.4" d="M28 96.5Q50 100 72 96.5"/></svg>`;
}

const lily = c => skin === 'her' ? lilyHer(c) : lilyHim(c);

/* ==========================================================================
   Local database (IndexedDB)
   ========================================================================== */

const DB = {
    db: null,
    ok: false,
    async open() {
        try {
            this.db = await new Promise((res, rej) => {
                const r = indexedDB.open('lily-lotus-dates', 1);
                r.onupgradeneeded = () => r.result.createObjectStore('events', { keyPath: 'id' });
                r.onsuccess = () => res(r.result);
                r.onerror = () => rej(r.error);
            });
            this.ok = true;
        } catch (e) { this.ok = false; }
    },
    st(m) { return this.db.transaction('events', m).objectStore('events'); },
    run(fn) {
        return new Promise(res => {
            if (!this.ok) { return res([]); }
            try {
                const r = fn(this);
                r.onsuccess = () => res(r.result);
                r.onerror = () => res([]);
            } catch (e) { res([]); }
        });
    },
    all() { return this.run(d => d.st('readonly').getAll()); },
    put(o) { return this.run(d => d.st('readwrite').put(o)); },
    del(id) { return this.run(d => d.st('readwrite').delete(id)); }
};

/* ==========================================================================
   Application state
   ========================================================================== */

let events = [];
let view = new Date();
let mode = 'month';
let q = '';
let cat = 'all';
let sel = ymd(new Date());
let role = null; // the one role currently signed in
view = new Date(view.getFullYear(), view.getMonth(), 1);
const list = () => events.filter(e => (cat === 'all' || e.cat === cat) && (!q || (e.title + ' ' + e.place + ' ' + e.notes).toLowerCase().includes(q))).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));

/* ==========================================================================
   Feedback: toasts and petal burst
   ========================================================================== */

const toast = m => {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = m;
    $('#toasts').append(t);
    setTimeout(() => t.remove(), 3100);
};

function burst(x, y) {
    for (let i = 0; i < 16; i++) {
        const p = document.createElement('i');
        p.className = 'petal';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        document.body.append(p);
        const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 120;
        p.animate([
            { transform: 'translate(0,0) rotate(0) scale(.4)', opacity: 1 },
            { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d + 110}px) rotate(${Math.random() * 540}deg) scale(1)`, opacity: 0 }
        ], { duration: 1100 + Math.random() * 700, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => p.remove();
    }
}

/* ==========================================================================
   Rendering: calendar, sidebar, filter chips
   ========================================================================== */

function renderCal(anim) {
    $('#title').textContent = `${MN[view.getMonth()]} ${view.getFullYear()}`;
    const L = list(), body = $('#body');
    if (mode === 'month') {
        const first = new Date(view.getFullYear(), view.getMonth(), 1), st = new Date(first);
        st.setDate(1 - first.getDay());
        let h = '<div class="wk">' + ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div>${d}</div>`).join('') + `</div><div class="grid ${anim ? 'enter' : ''}">`;
        for (let i = 0; i < 42; i++) {
            const d = new Date(st);
            d.setDate(st.getDate() + i);
            const k = ymd(d), ev = L.filter(e => e.date === k);
            h += `<div class="cell ${d.getMonth() !== view.getMonth() ? 'out' : ''} ${k === ymd(new Date()) ? 'today' : ''} ${k === sel ? 'sel' : ''}" data-d="${k}" tabindex="0" role="button" aria-label="${k}" style="--d:${i}"><span class="n">${d.getDate()}</span>` +
                ev.slice(0, 2).map(e => `<button class="pill ${e.done ? 'done' : ''}" data-id="${e.id}" style="--c:${CATS[e.cat][1]}" title="${esc(e.title)}">${tm(e.start).replace(' ', '').toLowerCase()} ${esc(e.title)}</button>`).join('') + (ev.length > 2 ? `<span class="more">+${ev.length - 2} more</span>` : '') + '</div>';
        }
        body.innerHTML = h + '</div>';
    } else {
        const m = L.filter(e => e.date.startsWith(`${view.getFullYear()}-${pad(view.getMonth() + 1)}`));
        if (!m.length) {
            body.innerHTML = `<div class="empty">${lily('bloom')}<b>No dates this month</b><br>Pick a day or press N to plan one.</div>`;
            return;
        }
        let h = '<div class="ag">', last = '';
        m.forEach((e, i) => {
            if (e.date !== last) {
                h += `<div class="day">${nice(e.date)}</div>`;
                last = e.date;
            }
            h += `<div class="row ${e.done ? 'done' : ''}" style="--c:${CATS[e.cat][1]};animation-delay:${i * 40}ms"><input type="checkbox" data-done="${e.id}" ${e.done ? 'checked' : ''} aria-label="Mark done"><div class="tx"><b>${esc(e.title)}</b><br><small>${tm(e.start)}${e.end ? ' – ' + tm(e.end) : ''}${e.place ? ' · ' + esc(e.place) : ''}</small></div><button class="ic" data-id="${e.id}" aria-label="Edit">✎</button><button class="ic" data-rm="${e.id}" aria-label="Delete">🗑</button></div>`;
        });
        body.innerHTML = h + '</div>';
    }
}

function renderSide() {
    const now = new Date(), nk = ymd(now) + pad(now.getHours()) + ':' + pad(now.getMinutes());
    const up = events.filter(e => !e.done && (e.date + (e.start || '00:00')) >= nk).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
    const n = up[0];
    let rel = '';
    if (n) {
        const ms = new Date(n.date + 'T' + (n.start || '00:00')) - now, m = Math.round(ms / 6e4), h = Math.round(m / 60), d = Math.round(ms / 864e5);
        rel = m < 60 ? `in ${Math.max(m, 1)} min` : h < 24 ? `in ${h} hr` : d <= 1 ? 'tomorrow' : `in ${d} days`;
    }
    $('#next').innerHTML = lily() + (n ? `<small>Next up · ${rel}</small><h3>${esc(n.title)}</h3><small>${nice(n.date)} · ${tm(n.start)}${n.place ? '<br>' + esc(n.place) : ''}</small>` : `<small>Next up</small><h3>Nothing planned</h3><small>Add a date to see it here.</small>`);
    const mo = events.filter(e => e.date.startsWith(`${view.getFullYear()}-${pad(view.getMonth() + 1)}`));
    $('#stats').innerHTML = `<div><b>${mo.length}</b><span>this month</span></div><div><b>${mo.filter(e => e.done).length}</b><span>done</span></div><div><b>${up.length}</b><span>upcoming</span></div>`;
    $('#up').innerHTML = up.length ? up.slice(0, 5).map(e => `<button class="item" data-id="${e.id}" style="--c:${CATS[e.cat][1]}"><span><b>${esc(e.title)}</b><small>${nice(e.date)} · ${tm(e.start)}</small></span></button>`).join('') : `<div class="empty">${lily('bloom')}Nothing on the horizon.</div>`;
}

const render = a => {
    if (!role) { return; }   // nothing draws unless someone is signed in
    renderCal(a);
    renderSide();
};

const buildChips = () => {
    $('#chips').innerHTML = `<button class="chip on" data-c="all">All</button>` + Object.entries(CATS).map(([k, v]) => `<button class="chip" data-c="${k}" style="--c:${v[1]}"><i></i>${v[0]}</button>`).join('');
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.c === cat));
};

/* ==========================================================================
   Modal: date form, delete, backup
   ========================================================================== */

const open = h => {
    $('#md').innerHTML = h;
    $('#ov').classList.add('show');
    const f = $('#md input,#md textarea');
    f && f.focus();
};

const close = () => $('#ov').classList.remove('show');

function form(id, date) {
    const e = events.find(x => x.id === id) || { date: date || sel, start: '18:00', end: '20:00', cat: 'date', title: '', place: '', notes: '' };
    open(`<h2>${id ? 'Edit date' : 'New date'}</h2><form id="f" class="f"><label class="w">Title<input name="title" required maxlength="80" value="${esc(e.title)}" placeholder="Dinner under the lanterns"></label>
  <label>Date<input type="date" name="date" required value="${e.date}"></label><label>Category<select name="cat">${Object.entries(CATS).map(([k, v]) => `<option value="${k}" ${k === e.cat ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></label>
  <label>Starts<input type="time" name="start" value="${e.start || ''}"></label><label>Ends<input type="time" name="end" value="${e.end || ''}"></label>
  <label class="w">Place<input name="place" maxlength="80" value="${esc(e.place)}" placeholder="Where?"></label><label class="w">Notes<textarea name="notes" rows="3" placeholder="Outfit, gift ideas, reminders…">${esc(e.notes)}</textarea></label>
  <div class="foot w">${id ? '<button type="button" class="btn del" id="rm">Delete date</button>' : ''}<button type="button" class="btn" id="cx">Cancel</button><button class="btn pri">Save date</button></div></form>`);
    $('#cx').onclick = close;
    if (id) { $('#rm').onclick = () => remove(id); }
    $('#f').onsubmit = async (ev) => {
        ev.preventDefault();
        const o = Object.fromEntries(new FormData(ev.target));
        o.id = id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        o.done = e.done || false;
        if (o.start && o.end && o.end <= o.start) {
            return toast('End time must be after the start time');
        }
        const clash = events.find(x => x.id !== o.id && x.date === o.date && x.start && o.start && x.end && o.end && x.start < o.end && o.start < x.end);
        const i = events.findIndex(x => x.id === o.id);
        i < 0 ? events.push(o) : events[i] = o;
        await DB.put(o);
        sel = o.date;
        const r = ev.submitter.getBoundingClientRect();
        burst(r.left + r.width / 2, r.top);
        close();
        view = new Date(o.date.slice(0, 4), +o.date.slice(5, 7) - 1, 1);
        render(true);
        toast(clash ? `Saved, but it overlaps “${clash.title}”` : DB.ok ? 'Date saved' : 'Saved for this visit only');
    };
}

async function remove(id) {
    events = events.filter(x => x.id !== id);
    await DB.del(id);
    close();
    render();
    toast('Date deleted');
}

function backup() {
    open(`<h2>Backup</h2><p style="color:var(--mut);margin:0 0 8px">Copy this text to keep a backup, or paste a saved backup here and import it.</p><textarea id="js" rows="9" style="width:100%">${esc(JSON.stringify(events))}</textarea><div class="foot"><button class="btn" id="cx">Close</button><button class="btn" id="cp">Copy</button><button class="btn pri" id="im">Import</button></div>`);
    $('#cx').onclick = close;
    $('#cp').onclick = () => {
        const t = $('#js');
        t.select();
        try { navigator.clipboard.writeText(t.value); }
        catch (e) { document.execCommand('copy'); }
        toast('Backup copied');
    };
    $('#im').onclick = async () => {
        try {
            const a = JSON.parse($('#js').value);
            if (!Array.isArray(a)) { throw 0; }
            for (const o of a) {
                if (o && o.id && o.title && o.date && CATS[o.cat]) {
                    const i = events.findIndex(x => x.id === o.id);
                    i < 0 ? events.push(o) : events[i] = o;
                    await DB.put(o);
                }
            }
            close();
            render(true);
            toast('Backup imported');
        } catch (e) {
            toast('That text isn’t a valid backup');
        }
    };
}

/* ==========================================================================
   Event listeners
   ========================================================================== */

document.addEventListener('click', async (e) => {
    if (!role) { return; }
    const t = e.target, pill = t.closest('[data-id]'), cell = t.closest('.cell'), rm = t.closest('[data-rm]');
    if (rm) { return remove(rm.dataset.rm); }
    if (pill) { return form(pill.dataset.id); }
    if (cell) {
        sel = cell.dataset.d;
        const o = new Date(sel + 'T00:00');
        if (o.getMonth() !== view.getMonth()) {
            view = new Date(o.getFullYear(), o.getMonth(), 1);
            render(true);
        } else {
            renderCal();
        }
        return form(null, sel);
    }
    const c = t.closest('.chip');
    if (c) {
        cat = c.dataset.c;
        document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
        render();
    }
    const m = t.closest('#seg button');
    if (m) {
        mode = m.dataset.m;
        document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === m));
        renderCal(true);
    }
    if (t === $('#ov')) { close(); }
});

document.addEventListener('change', async (e) => {
    const id = e.target.dataset.done;
    if (!id || !role) { return; }
    const o = events.find(x => x.id === id);
    if (!o) { return; }
    o.done = e.target.checked;
    await DB.put(o);
    if (o.done) {
        const r = e.target.getBoundingClientRect();
        burst(r.left, r.top);
        toast('Marked as done');
    }
    render();
});

$('#prev').onclick = () => {
    view = new Date(view.getFullYear(), view.getMonth() - 1, 1);
    render(true);
};

$('#nxt').onclick = () => {
    view = new Date(view.getFullYear(), view.getMonth() + 1, 1);
    render(true);
};

$('#today').onclick = () => {
    const n = new Date();
    view = new Date(n.getFullYear(), n.getMonth(), 1);
    sel = ymd(n);
    render(true);
};

$('#new').onclick = () => form(null, sel);
$('#bk').onclick = backup;

$('#q').oninput = e => {
    q = e.target.value.trim().toLowerCase();
    render();
};

document.addEventListener('keydown', e => {
    if (!document.documentElement.classList.contains('in')) { return; }
    if (e.key === 'Escape') { return close(); }
    if (e.key === 'Enter' && e.target.classList.contains('cell')) { return e.target.click(); }
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || $('#ov').classList.contains('show')) { return; }
    if (e.key === 'n') { (e.preventDefault(), form(null, sel)); }
    else if (e.key === 't') { $('#today').click(); }
    else if (e.key === '/') { (e.preventDefault(), $('#q').focus()); }
    else if (e.key === 'ArrowLeft') { $('#prev').click(); }
    else if (e.key === 'ArrowRight') { $('#nxt').click(); }
});

/* ==========================================================================
   Skin switching and background garden
   ========================================================================== */

function setSkin(k) {
    if (k !== role) { return; }   // never render an interface you're not signed in as
    skin = k;
    document.documentElement.dataset.skin = k;
    for (const c in CATS) { CATS[c][1] = PAL[k][c]; }
    $('#logo').innerHTML = lily('bloom');
    $('#garden').innerHTML = GARDEN();
    $('#h1').textContent = TXT[k][0];
    $('#tag').textContent = TXT[k][1];
    buildChips();
    render(true);
}

const GARDEN = () => [
    [8, 12, 150, 16, '18s', 25],
    [78, 6, 200, -10, '22s', -30],
    [88, 62, 130, 30, '16s', 40],
    [2, 70, 180, -20, '20s', -25],
    [46, 84, 110, 10, '14s', 35]
].map(([x, y, s, r, t, d]) => lily('').replace('<svg class="lily "', `<svg class="lily" style="left:${x}%;top:${y}%;width:${s}px;transform:rotate(${r}deg);--t:${t};--rot:${d}deg"`)).join('');

/* ==========================================================================
   Login (kept on this device only)
   ========================================================================== */

const ACC = {
    get() {
        try { return JSON.parse(localStorage.getItem('ld-acc') || '{}'); }
        catch (e) { return window._acc || {}; }
    },
    set(a) {
        window._acc = a;
        try { localStorage.setItem('ld-acc', JSON.stringify(a)); } catch (e) { }
    }
};

async function hash(pw, salt) {
    const d = salt + ':' + pw;
    if (window.crypto && crypto.subtle) {
        const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(d));
        return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
    let h = 5381;
    for (const c of d) { h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; }
    return 'x' + h;
}

function buildLogin() {
    const acc = ACC.get();
    $('#login').innerHTML = '<h1 class="lt">Who’s signing in?</h1>' + '<button type="button" class="lk" id="lkimp" style="position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:3;color:#fff;opacity:.85">Already have an account on another device?</button>' + ['her', 'him'].map(r => {
        const a = acc[r], g = r === 'her';
        return `<section class="pane ${r}" data-r="${r}"><div class="box"><div class="lg">${g ? lilyHer('bloom') : lilyHim('bloom')}</div><h2>${g ? 'Girlfriend' : 'Boyfriend'}</h2><p class="sub">${a ? 'Welcome back, ' + esc(a.name) : g ? 'Step into the lily garden' : 'Step into the midnight lotus'}</p>
<form data-r="${r}" autocomplete="off">${a ? '' : '<input name="name" placeholder="Your name" maxlength="24" required>'}<input name="pw" type="password" placeholder="${a ? 'Passcode' : 'Create a passcode (4+ characters)'}" minlength="4" required autocomplete="${a ? 'current-password' : 'new-password'}"><label class="keep"><input type="checkbox" name="keep"> Keep me signed in on this device</label><div class="err" role="alert"></div><button class="go">${a ? 'Enter' : 'Create and enter'}</button><div class="lnk">${a ? '<button type="button" class="lk" data-reset>Forgot passcode?</button>' : ''}<button type="button" class="lk" data-back>Back</button></div></form><p class="tap">Tap to sign in</p></div></section>`;
    }).join('');
}

function pick(p) {
    document.querySelectorAll('#login .pane').forEach(x => {
        x.classList.toggle('open', x === p);
        x.classList.toggle('shrunk', !!p && x !== p);
    });
    const i = p && p.querySelector('input');
    i && setTimeout(() => i.focus(), 500);
}

$('#login').addEventListener('click', async e => {
    if (e.target.closest('#lkimp')) { return importDevice(); }
    const p = e.target.closest('.pane');
    if (!p) { return; }
    if (e.target.closest('[data-back]')) { return pick(null); }
    if (e.target.closest('[data-reset]')) {
        const r = p.dataset.r, other = r === 'her' ? 'him' : 'her', a = ACC.get();
        if (a[other]) {
            const pw = prompt(`To reset this passcode, enter the ${other === 'her' ? 'girlfriend' : 'boyfriend'}'s passcode:`);
            if (pw === null) { return; }
            if (await hash(pw, a[other].salt) !== a[other].h) {
                alert('That passcode is incorrect, so the reset was cancelled.');
                return;
            }
        }
        delete a[r];
        ACC.set(a);
        buildLogin();
        pick(document.querySelector('#login .pane.' + r));
        return;
    }
    if (!p.classList.contains('open')) { pick(p); }
});

$('#login').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target, r = f.dataset.r, acc = ACC.get(), el = f.elements, pw = el.pw.value, pane = f.closest('.pane');
    if (!acc[r]) {
        const salt = Math.random().toString(36).slice(2);
        acc[r] = {
            name: (el.name.value || '').trim() || (r === 'her' ? 'Her' : 'Him'),
            salt,
            h: await hash(pw, salt)
        };
        ACC.set(acc);
    } else if (await hash(pw, acc[r].salt) !== acc[r].h) {
        f.querySelector('.err').textContent = 'That passcode doesn’t match. Try again.';
        pane.classList.remove('shake');
        void pane.offsetWidth;
        pane.classList.add('shake');
        el.pw.select();
        return;
    }
    signIn(r, el.keep.checked);
});

/* Removes the other person's interface from the running page */
function purgeOther(r) {
    const o = r === 'her' ? 'him' : 'her';
    const s = document.getElementById('skin-' + o);
    if (s) { s.remove(); }          // their colours and theme
    delete PAL[o];                  // their category colours
    delete TXT[o];                  // their title and tagline
    if (o === 'her') { lilyHer = () => ''; } else { lilyHim = () => ''; }   // their artwork
}

async function signIn(r, keep) {
    const a = ACC.get()[r];
    if (!a) { return; }
    role = r;
    try { localStorage.setItem('ld-active', r); } catch (e) { }   // other tabs watch this key
    try {
        sessionStorage.setItem('ld-role', r);
        keep ? localStorage.setItem('ld-keep', r) : localStorage.removeItem('ld-keep');
    } catch (e) { }
    events = await DB.all();
    $('#login').innerHTML = '';              // the other login pane is removed from the page
    purgeOther(r);                           // and so is the other person's whole interface
    document.documentElement.classList.add('in');
    $('#who').textContent = 'Hi, ' + a.name;
    setSkin(r);
    burst(innerWidth / 2, innerHeight / 3);
    toast('Welcome, ' + a.name);
}

/* Clears the signed-in interface from the page and shows the login screen */
function wipeUI() {
    try { sessionStorage.removeItem('ld-role'); } catch (e) { }
    role = null;
    events = [];
    q = '';
    cat = 'all';
    $('#q').value = '';
    ['#body', '#next', '#stats', '#up', '#garden', '#logo', '#chips'].forEach(s => $(s).innerHTML = '');
    $('#who').textContent = '';
    document.documentElement.classList.remove('in');
    close();
    location.reload();   // fresh page: the removed interface only exists again on the login screen
}

$('#out').onclick = () => {
    try {
        localStorage.removeItem('ld-keep');
        localStorage.removeItem('ld-active');
    } catch (e) { }
    wipeUI();
};

/* If another tab on this device signs in as the other person, this tab is locked out at once */
window.addEventListener('storage', e => {
    if (e.key === 'ld-active' && role && e.newValue && e.newValue !== role) {
        try { sessionStorage.setItem('ld-msg', 'Signed out: the other account signed in on this device'); } catch (x) { }
        wipeUI();
    }
});

/* ---- Move accounts and dates to another device ---- */
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = s => JSON.parse(decodeURIComponent(escape(atob(s.trim()))));

$('#lnkdev').onclick = () => {
    if (!role) { return; }
    const all = ACC.get();
    const code = enc({ acc: { [role]: all[role] }, events });   // only your own account, never the other person's
    open(`<h2>Link device</h2><p style="color:var(--mut);margin:0 0 8px">Copy this code, then on your other device choose “Already have an account?” on the login screen and paste it. Keep it private.</p><textarea id="js" rows="7" style="width:100%" readonly>${code}</textarea><div class="foot"><button class="btn" id="cx">Close</button><button class="btn pri" id="cp">Copy</button></div>`);
    $('#cx').onclick = close;
    $('#cp').onclick = () => {
        const t = $('#js');
        t.select();
        try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand('copy'); }
        toast('Code copied');
    };
};

async function importDevice() {
    const s = prompt('Paste the code from your other device:');
    if (!s) { return; }
    try {
        const d = dec(s);
        if (!d || typeof d.acc !== 'object') { throw 0; }
        ACC.set({ ...ACC.get(), ...d.acc });
        for (const o of (d.events || [])) {
            if (o && o.id && o.title && o.date && CATS[o.cat]) { await DB.put(o); }
        }
        buildLogin();
        toast('Accounts imported. You can sign in now.');
    } catch (e) {
        alert('That code isn’t valid.');
    }
}

/* ---- Reset data on this device ---- */
$('#rst').onclick = async () => {
    if (!role) { return; }
    if (!confirm('Delete ALL dates on this device? This cannot be undone.')) { return; }
    const withAccounts = confirm('Also delete the saved accounts and passcodes on this device?\n\nOK = delete accounts too\nCancel = keep the accounts');
    for (const o of events.slice()) { await DB.del(o.id); }
    events = [];
    if (withAccounts) {
        try {
            localStorage.removeItem('ld-acc');
            localStorage.removeItem('ld-keep');
            localStorage.removeItem('ld-active');
            sessionStorage.removeItem('ld-role');
        } catch (e) { }
        window._acc = {};
        location.reload();
        return;
    }
    render(true);
    toast('All dates deleted');
};

function startAuth() {
    let r = null;
    try { r = sessionStorage.getItem('ld-role') || localStorage.getItem('ld-keep'); } catch (e) { }
    if (r && ACC.get()[r]) {
        let keep = false;
        try { keep = !!localStorage.getItem('ld-keep'); } catch (e) { }
        signIn(r, keep);
    } else {
        buildLogin();
    }
}

/* ==========================================================================
   Startup
   ========================================================================== */

(async () => {
    await DB.open();
    // remove the old sample dates if they are still stored
    const old = await DB.all();
    for (const o of old.filter(x => /^s[1-4]$/.test(x.id))) { await DB.del(o.id); }
    if (!DB.ok) { toast('Storage is unavailable, so dates last only for this visit'); }
    events = [];   // nothing is loaded until a role signs in
    startAuth();
    try {
        const m = sessionStorage.getItem('ld-msg');
        if (m) { sessionStorage.removeItem('ld-msg'); toast(m); }
    } catch (e) { }
})();
</script>
</body>
</html>
